name: qr_scanner
description: Capacidad de lectura de códigos QR/barras sobre camera_core. Aísla ML Kit tras un adaptador y expone modelos propios y UI componible.
version: 0.1.0
publish_to: 'none'

# ML Kit barcode 0.16.x exige Dart ^3.12.0 / Flutter >=3.44.0.
environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  camera_core:
    path: ../camera_core
  # 0.16.x depende de google_mlkit_commons ^0.13.0, alineándose con
  # google_mlkit_face_detection 0.15.1 (que ya usa CAPPFRONT). Versiones
  # anteriores (0.14.x) fijaban commons ^0.11.0 y entraban en conflicto.
  google_mlkit_barcode_scanning: ^0.16.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
