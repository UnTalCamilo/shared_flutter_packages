include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # El contrato público debe mantenerse documentado.
    public_member_api_docs: ignore

linter:
  rules:
    - prefer_const_constructors
    - prefer_final_fields
    - unawaited_futures
